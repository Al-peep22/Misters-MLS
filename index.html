<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Misters Limitless Schedules - Login</title>
    <link rel="stylesheet" href="./css/web.css">
    <script defer src="./js/web.js"></script>
</head>
<body class="login-body">
    <main class="login-container">
        <img src="./images/misters-logo.png" alt="Mister Car Wash Logo" class="login-logo">

        <form id="loginForm" class="login-form">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>

            <button type="submit">Login</button>
            <p id="loginError" class="login-error"></p>
        </form>
    </main>

    <footer>
        <p>&copy; 10-16-2026 | Misters Limitless Schedules | By Alison Waldsmith</p>
    </footer>
</body>
</html>
